<script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const items=[['奶油垂感衬衫','上衣','p1'],['莓粉针织开衫','外套','p2'],['深蓝直筒牛仔裤','裤子','p3'],['燕麦格纹半裙','裙子','p4'],['粉色乐福鞋','鞋','p5'],['奶油蝴蝶结包','包','p6'],['雾紫花朵头巾','头巾','p7'],['柔软针织叠搭','上衣','p8']];let category='全部';
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove('show'),1900)};
function go(id){$$('.page').forEach(x=>x.classList.toggle('active',x.id===id));$$('.nav [data-go]').forEach(x=>x.classList.toggle('on',x.dataset.go===id));$('#overlay').classList.remove('show');$('.screen').scrollTop=0}
function styleMode(mode){$('#manual').hidden=mode!=='manual';$('#ai').hidden=mode!=='ai';$$('[data-stylemode]').forEach(b=>b.classList.toggle('on',b.dataset.stylemode===mode))}
function render(){const q=$('#search').value.trim();const shown=items.filter(x=>(category==='全部'||x[1]===category)&&x[0].includes(q));$('#count').textContent=items.length+' 件';$('#itemGrid').innerHTML=shown.map((x,i)=>`<button class="item" data-item="${items.indexOf(x)}"><div class="itempic ${x[2]}"></div><b>${x[0]}</b><small>${x[1]} · 点击查看</small></button>`).join('')||'<p style="grid-column:1/-1;text-align:center;color:#9c8885;padding:45px 0">没有找到单品，换个分类试试吧</p>';$('#tray').innerHTML=items.map((x,i)=>`<button data-wear="${i}" aria-label="穿上${x[0]}"><i class="thumb ${x[2]}"></i></button>`).join('')}
const sub={weather:['今日天气','26℃，有阵雨。建议选择轻薄外套和防水鞋，头巾可选不易滑动的材质。'],conditions:['搭配条件','选择温度、场合、色系与目标后，布灵会重新生成三套穿搭。'],scenes:['更多场景','上班、约会、聚餐、旅行、运动、甜品店、海边、博物馆。'],body:['身体数据与身形','身高 162cm · 肩宽 38cm · 腰围 66cm · 臀围 92cm。<br><br>目标：显高、显瘦，避免显肩宽与显胯宽。'],preference:['搭配偏好','主要风格：日系、韩系。<br><br>偏爱低饱和暖色、垂感面料、干净层次和适合头巾的配色。'],goals:['我的搭配目标','✓ 显高　✓ 显瘦　✓ 舒适<br>✓ 有气质　✓ 上镜'],privacy:['本地数据与隐私','衣服照片、身体照片与尺寸默认只保存在手机。需要联网分析时会再次征求同意。'],japanese:['日系松弛','柔软材质、自然层次、低对比配色与舒适轮廓。'],korean:['韩系通勤','利落线条、短上衣与高腰比例、干净协调的色彩。'],colors:['低饱和配色','奶油白、雾粉、淡紫、薄荷绿、灰蓝与燕麦色。'],notice:['布灵的消息','今天的三套通勤灵感已经准备好啦 ✦'],worn:['当前穿搭','点击下方任意单品即可替换模型上的单品。'],result:['穿搭详情','这套搭配兼顾显高、舒适和上镜。你可以替换任意单品，或为结果评分。<br><br><button class="primary" data-toast="已记录你的喜好，布灵会继续学习 ✦">喜欢这套 ♥</button>']};
function openSub(key,title,html){const v=sub[key]||[title||'功能详情',html||'这个页面的下一步功能正在完善中。'];$('#subTitle').textContent=title||v[0];$('#subContent').innerHTML=`<div class="card"><p style="font-size:11px;line-height:1.8;color:#7e6e6b">${html||v[1]}</p></div><div class="options" style="margin-top:13px"><button data-toast="设置已保存"><b>保存设置</b><small>当前为可交互原型，数据保存在浏览器</small></button><button data-toast="下一版将继续完善"><b>继续完善这个功能</b><small>后续接入真实数据与 AI</small></button></div>`;$('#overlay').classList.add('show')}
function openItem(i){const x=items[i];$('#subTitle').textContent=x[0];$('#subContent').innerHTML=`<div class="detail-hero ${x[2]}"></div><div class="detail-info"><h2>${x[0]}</h2><p>${x[1]} · 低饱和色 · 春秋适用<br>适合通勤、咖啡店与书店场景。</p></div><div class="options"><button data-wear="${i}"><b>加入当前穿搭</b><small>在试衣间查看搭配效果</small></button><button data-toast="已收藏这件单品 ♥"><b>收藏单品</b><small>提高 AI 推荐权重</small></button></div>`;$('#overlay').classList.add('show')}
function openModal(type){const body=$('#modalBody');if(type==='add')body.innerHTML='<h2>添加到布灵布灵</h2><button class="opt" data-modal="import"><i class="icon i-link"></i><span><b>从购物 App 导入</b><br><small>粘贴商品分享链接（推荐）</small></span></button><button class="opt" data-toast="相机入口已响应，下一版接入真实拍摄"><i class="icon i-camera"></i><span><b>拍摄现有衣服</b></span></button><button class="opt" data-toast="相册入口已响应，下一版接入文件选择"><i class="icon i-add"></i><span><b>从相册选择</b></span></button>';else body.innerHTML='<h2>从商品链接导入</h2><p style="font-size:10px;color:#9c8885;text-align:center">粘贴淘宝、京东、小红书等商品分享链接</p><textarea id="productLink" placeholder="在这里粘贴商品链接…"></textarea><button class="primary" id="importBtn">识别并加入衣橱 ✦</button>';$('#modal').classList.add('show')}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-go]');if(!b)return;if(b.dataset.go){go(b.dataset.go);if(b.dataset.mode)styleMode(b.dataset.mode)}else if(b.dataset.stylemode)styleMode(b.dataset.stylemode);else if(b.dataset.modal)openModal(b.dataset.modal);else if(b.dataset.open)openSub(b.dataset.open);else if(b.dataset.item!=null)openItem(+b.dataset.item);else if(b.dataset.wear!=null){$('#worn').textContent='♥';go('style');styleMode('manual');toast(items[+b.dataset.wear][0]+' 已加入搭配')}else if(b.dataset.toast)toast(b.dataset.toast);else if(b.dataset.scene){$$('[data-scene]').forEach(x=>x.classList.remove('on'));b.classList.add('on');toast('场景已切换为'+b.dataset.scene)}});
$('#back').onclick=()=>$('#overlay').classList.remove('show');$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};$('#search').oninput=render;$$('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;$$('[data-cat]').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()});$('#generate').onclick=()=>{toast('正在翻翻你的衣橱…');setTimeout(()=>{$('#results').hidden=false;toast('三套穿搭生成好了 ✦')},800)};$('#analyze').onclick=()=>toast($('#ideaLink').value?'已提取：日系、低饱和、垂感 ✦':'先粘贴一条灵感链接呀');$('#modalBody').addEventListener('click',e=>{if(e.target.closest('#importBtn')){const v=$('#productLink')?.value.trim();if(!v)return toast('先粘贴一条商品链接呀');items.push(['新导入的垂感衬衫','上衣','p1']);render();$('#modal').classList.remove('show');toast('已经放进你的衣橱 ✦')}});render();
})();
</script></body></html>
