<style id="profile-priority-ui-v9">

.choice-intro{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.choice-intro b{font-size:12px}.choice-intro small{font-size:8px;color:var(--muted);text-align:right;line-height:1.45}
.compact-manager{gap:6px!important}
.compact-tag{grid-template-columns:22px minmax(0,1fr) 34px 34px!important;gap:5px!important;padding:5px 6px!important;border-radius:12px!important;min-height:46px;background:#fff!important}
.compact-tag.dragging{opacity:.55;border-color:var(--pink)!important}
.drag-handle{padding:0!important;background:transparent!important;color:#b69a9f!important;cursor:grab!important;font-size:15px!important;touch-action:none}
.compact-tag .tag-toggle{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:7px!important;min-width:0!important;padding:7px 10px!important;border-radius:10px!important;text-align:left!important;background:#faeef1!important;color:var(--ink)!important}
.compact-tag .tag-toggle.on{background:var(--berry)!important;color:#fff!important}
.compact-tag .tag-toggle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.compact-tag .tag-toggle small{flex:none;font-size:7px;opacity:.78}
.tag-icon-btn{width:34px!important;height:34px!important;padding:0!important;border-radius:10px!important;background:var(--pale)!important}
.danger-lite{color:#b94e68!important}
.compact-add{margin-top:8px!important}.compact-add input{padding:9px 10px!important}.compact-add button{padding:0 12px!important}
.compact-save{margin-top:10px!important}

<style id="home-location-wardrobe-polish-v10">

  var latitude=p.coords.latitude,longitude=p.coords.longitude;

};

 $('#subContent').innerHTML='<div class="body-visualizer"><div class="human-viewport"><iframe id="human3dFrame" title="可旋转女性人体模型" src="bodyapps/female.html?v=2bc8d35" style="width:100%;height:100%;border:0;display:block" allow="fullscreen"></iframe></div><div class="model-color-control"><label><span>模型颜色</span><output id="modelHueName">冰川蓝</output></label><input id="modelHue" type="range" min="0" max="359" value="'+savedHue+'" aria-label="调整模型颜色"></div><div class="metric-panel">'+metrics.map(m=>'<div class="metric-control"><header><b>'+m[1]+'</b><span class="metric-value"><input id="num-'+m[0]+'" type="number" min="'+m[3]+'" max="'+m[4]+'" value="'+d[m[0]]+'"><em>'+m[2]+'</em></span></header><input id="range-'+m[0]+'" type="range" min="'+m[3]+'" max="'+m[4]+'" step="'+m[5]+'" value="'+d[m[0]]+'"></div>').join('')+'<div class="bmi-card"><header><b>BMI</b><span id="bmiState">健康范围</span></header><div class="bmi-reading"><strong id="bmiValue">--</strong><small>kg/m²</small></div><div class="bmi-scale"><i id="bmiMarker"></i></div><div class="bmi-labels"><span>16.5</span><span>18.5</span><span>25</span><span>30</span><span>35+</span></div></div><button class="primary" id="saveHumanBody">保存身体数据</button><p class="visualizer-tip">完整女性人体网格会随尺寸平滑变化；仅用于穿搭比例预览，不作医学判断。模型：BodyApps（LGPL-3.0）。</p></div></div>';
 $('#overlay').classList.add('show');
 const frame=$('#human3dFrame');
 const read=()=>Object.fromEntries(metrics.map(m=>[m[0],Math.max(m[3],Math.min(m[4],+$('#num-'+m[0]).value||d[m[0]]))]));
 const updateBMI=()=>{const v=read(),bmi=v.weight/Math.pow(v.height/100,2),value=Math.round(bmi*10)/10;let state='健康范围',color='#24b987';if(value<18.5){state='偏轻';color='#d2ac35'}else if(value<25){state='健康范围';color='#24b987'}else if(value<30){state='偏高';color='#d0a337'}else if(value<35){state='肥胖 I 级';color='#d17827'}else{state='肥胖 II 级';color='#c94d70'}$('#bmiValue').textContent=value.toFixed(1);$('#bmiState').textContent=state;$('#bmiState').style.color=color;$('#bmiMarker').style.left=Math.max(1,Math.min(99,(value-15)/25*100))+'%'};
 const send=()=>frame.contentWindow?.postMessage({type:'bodyapps-update',values:read()},'*');
 const colorName=h=>h<25?'莓粉':h<70?'蜜桃橙':h<165?'薄荷绿':h<225?'冰川蓝':h<285?'薰衣草紫':h<315?'雾紫':'莓粉';
 const sendColor=()=>{const h=+$('#modelHue').value;$('#modelHueName').textContent=colorName(h);frame.contentWindow?.postMessage({type:'bodyapps-color',hue:h},'*')};
 window.addEventListener('message',function ready(e){if(e.source===frame.contentWindow&&e.data?.type==='bodyapps-ready'){send();sendColor();window.removeEventListener('message',ready)}});
 frame.addEventListener('load',()=>setTimeout(()=>{send();sendColor()},120));$('#modelHue').oninput=()=>{localStorage.setItem('bling-body-hue-v2',$('#modelHue').value);sendColor()};sendColor();
 metrics.forEach(m=>{const range=$('#range-'+m[0]),num=$('#num-'+m[0]);range.oninput=()=>{num.value=range.value;send();updateBMI()};num.oninput=()=>{range.value=num.value;send();updateBMI()}});
 updateBMI();
 $('#saveHumanBody').onclick=()=>{const savedBody=read();localStorage.setItem('bling-body',JSON.stringify(savedBody));updateProfileStats();toast('身体数据已保存，个人档案已同步 ✦')};
};
})();
</script></body></html>
