 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(28,host.clientWidth/host.clientHeight,.01,100),renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.appendChild(renderer.domElement);

   const box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());const normal=2.45/Math.max(size.y,.001);root.scale.setScalar(normal);root.position.copy(center).multiplyScalar(-normal);root.userData.baseScale=normal;scene.add(root);

   const v=read(),hs=v.height/170,ws=1+(v.weight-62)/360;root.scale.set(normal*ws,normal*hs,normal*ws);deform=(()=>{const original=deform;return function(){const values=read(),h=values.height/170,w=1+(values.weight-62)/360;root.scale.set(normal*w,normal*h,normal*w);meshData.forEach(({mesh,base,minY,maxY})=>{const p=mesh.geometry.attributes.position,a=p.array,span=Math.max(.0001,maxY-minY);for(let i=0;i<a.length;i+=3){const t=(base[i+1]-minY)/span,region=1+gaussian(t,.64,.115)*(values.bust-88)/145+gaussian(t,.49,.095)*(values.waist-72)/155+gaussian(t,.38,.115)*(values.hip-94)/145;a[i]=base[i]*region;a[i+1]=base[i+1];a[i+2]=base[i+2]*region}p.needsUpdate=true;mesh.geometry.computeVertexNormals()})}})();deform();scene.updateMatrixWorld(true);const fittedBox=new THREE.Box3().setFromObject(root),fittedCenter=fittedBox.getCenter(new THREE.Vector3()),fittedSize=fittedBox.getSize(new THREE.Vector3()),fit=Math.max(fittedSize.x,fittedSize.y,fittedSize.z);controls.target.copy(fittedCenter);camera.position.set(fittedCenter.x,fittedCenter.y,fittedCenter.z+fit*1.75);camera.near=Math.max(.001,fit/100);camera.far=fit*20;camera.updateProjectionMatrix();controls.minDistance=fit*.7;controls.maxDistance=fit*4;controls.update();loading.hidden=true;

 metrics.forEach(m=>{const range=$('#range-'+m[0]),num=$('#num-'+m[0]);range.oninput=()=>{num.value=range.value;deform()};num.oninput=()=>{range.value=num.value;deform()}});

 let last=performance.now();const animate=()=>{if(!host.isConnected){renderer.dispose();return}requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);last=performance.now()};animate();

};
