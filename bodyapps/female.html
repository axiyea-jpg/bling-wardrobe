<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>布灵女性身形模型</title><style>
*{box-sizing:border-box}html,body,#stage{width:100%;height:100%;margin:0;overflow:hidden;background:#12161c}canvas{display:block;touch-action:none}
#status{position:absolute;inset:0;display:grid;place-items:center;color:#d9ecff;font:14px system-ui;background:#12161c;z-index:3}
#hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#dbeaffb8;font:12px system-ui;pointer-events:none}
#credit{position:absolute;right:10px;top:8px;color:#c8dcf080;font:9px system-ui;text-decoration:none}
</style></head><body><div id="stage"></div><div id="status">正在加载女性人体模型…</div><div id="hint">拖动旋转 · 双指或滚轮缩放</div><a id="credit" href="https://github.com/OpnTec/bodyapps-viz" target="_blank">BodyApps · LGPL-3.0</a>
<script src="three-r67.js"></script><script>
(function(){
var stage=document.getElementById('stage'), status=document.getElementById('status');
if(!window.THREE){status.textContent='3D 组件加载失败';return}
var scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(27,stage.clientWidth/stage.clientHeight,1,100000);
camera.position.set(0,2950,4200);
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setClearColor(0x12161c,1);renderer.setSize(stage.clientWidth,stage.clientHeight);stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9ecff,0x172238,1.25));
var key=new THREE.DirectionalLight(0xffffff,1.35);key.position.set(5,8,7);scene.add(key);
var fill=new THREE.DirectionalLight(0x79baff,.72);fill.position.set(-5,2,4);scene.add(fill);
var rim=new THREE.DirectionalLight(0x7c9dff,.9);rim.position.set(3,4,-5);scene.add(rim);
var root=new THREE.Object3D(),mesh=null,angle=0,targetY=2850,distance=4200,drag=false,lastX=0,lastY=0,tilt=0.02,idleAt=Date.now();
scene.add(root);
var names=["Height","Neck Height","Neck","Shoulders","Shoulder Angle","Breast","Bust Girth","Arm Length","Upper Arm Girth","Wrist","Stomach Form","Waist","Hip Girth","Hip Height","Thigh Girth","Calf Girth","lower Leg"];
var mid=[155,7,31,14,1,85,66,23,27,14,1,75,100,82,58,36,45], low=[110,5,27,12,0,70,56,16,22,9,0,65,86,72,49,26,39], high=[210,9,35,16,2,100,76,27,32,18,2,85,114,92,66,44,53];
var current={height:162,weight:52,shoulder:38,bust:84,waist:66,hip:92};
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function map(v,a,b,c,d){return c+(clamp(v,a,b)-a)*(d-c)/(b-a)}
function apply(){
 if(!mesh||!mesh.morphTargetInfluences)return;
 var values=mid.slice(),w=current.weight||52;
 values[0]=clamp(current.height,110,210);
 values[3]=map(current.shoulder||38,30,50,12,16);
 values[5]=map(current.bust||84,70,125,70,100);
 values[6]=map(current.bust||84,70,125,56,76);
 values[8]=map(w,38,110,22,32);
 values[10]=map(w,38,110,0,2);
 values[11]=clamp(current.waist,65,85);
 values[12]=clamp(current.hip,86,114);
 values[14]=map(w,38,110,49,66);
 values[15]=map(w,38,110,26,44);
 for(var i=0;i<names.length;i++)mesh.morphTargetInfluences[i]=(values[i]-mid[i])/(high[i]-low[i]);
}
new THREE.JSONLoader().load('female.js',function(geometry){
 geometry.computeBoundingBox();geometry.computeVertexNormals();
 var material=new THREE.MeshPhongMaterial({color:0x8fc7f3,ambient:0x263d58,specular:0xbddfff,shininess:22,morphTargets:true,side:THREE.DoubleSide});
 mesh=new THREE.Mesh(geometry,material);root.add(mesh);root.scale.set(70,70,70);
 root.position.y=2400-geometry.boundingBox.min.y*70;root.position.z=100;
 apply();status.style.display='none';
},undefined,function(){status.textContent='人体模型加载失败，请刷新重试'});
function setCamera(){camera.position.x=Math.sin(angle)*distance;camera.position.z=Math.cos(angle)*distance;camera.position.y=targetY+Math.sin(tilt)*distance*.45;camera.lookAt(new THREE.Vector3(0,targetY,0))}
function pointerDown(x,y){drag=true;lastX=x;lastY=y;idleAt=Date.now()}
function pointerMove(x,y){if(!drag)return;angle-=(x-lastX)*.009;tilt=clamp(tilt+(y-lastY)*.004,-.65,.65);lastX=x;lastY=y;idleAt=Date.now()}
renderer.domElement.addEventListener('mousedown',function(e){pointerDown(e.clientX,e.clientY)});
window.addEventListener('mousemove',function(e){pointerMove(e.clientX,e.clientY)});window.addEventListener('mouseup',function(){drag=false});
renderer.domElement.addEventListener('touchstart',function(e){if(e.touches.length===1)pointerDown(e.touches[0].clientX,e.touches[0].clientY);if(e.touches.length===2){drag=false;lastX=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)}},{passive:true});
renderer.domElement.addEventListener('touchmove',function(e){if(e.touches.length===1)pointerMove(e.touches[0].clientX,e.touches[0].clientY);if(e.touches.length===2){var n=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);distance=clamp(distance-(n-lastX)*8,2300,7000);lastX=n;idleAt=Date.now()}},{passive:true});
renderer.domElement.addEventListener('touchend',function(){drag=false});
renderer.domElement.addEventListener('wheel',function(e){e.preventDefault();distance=clamp(distance+e.deltaY*2.5,2300,7000);idleAt=Date.now()},{passive:false});
window.addEventListener('message',function(e){var m=e.data||{};if(m.type==='bodyapps-update'){current=m.values||current;apply()}if(m.type==='bodyapps-angle'){angle=(+m.angle||0)*Math.PI/180;idleAt=Date.now()}});
window.addEventListener('resize',function(){camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)});
function loop(){requestAnimationFrame(loop);if(!drag&&Date.now()-idleAt>2200)angle+=.0025;setCamera();renderer.render(scene,camera)}loop();
parent.postMessage({type:'bodyapps-ready'},'*');
})();
</script></body></html>
